/* Semantic surfaces follow the active Obsidian theme. All rules are plugin scoped. */
.nf-managed, .nf-dialog, .nf-resume {
  --nf-surface: var(--background-primary);
  --nf-foreground: var(--text-normal);
  --nf-muted: var(--text-muted);
  --nf-subtle: color-mix(in srgb, var(--text-normal) 4%, var(--background-primary));
  --nf-hover: color-mix(in srgb, var(--text-normal) 7%, var(--background-primary));
  --nf-border: color-mix(in srgb, var(--text-normal) 13%, var(--background-primary));
  --nf-ring: color-mix(in srgb, var(--text-normal) 40%, transparent);
  --nf-radius: 10px;
  --nf-page-width: 960px;
  --nf-gutter: 40px;
}
/* Hide native controls only while a replacement is mounted. */
.nf-managed { container: nebula-page / inline-size; }
.nf-managed > .view-header { display: none; }
.nf-managed.nf-page-mounted.nf-reading-view > .view-content { display: none !important; }
body.is-mobile.nf-quiet.nf-reading :is(.mobile-navbar, .mobile-toolbar) { display: none; }
.nf-page[hidden], .nf-button[hidden] { display: none; }

/* Quiet navigation, with a breadcrumb that can shrink independently of actions. */
.nf-bar {
  display: flex; align-items: center; justify-content: space-between;
  flex: 0 0 auto; min-height: 54px; gap: 16px; padding: 7px 18px;
  background: var(--nf-surface); color: var(--nf-muted);
  border-bottom: 1px solid var(--nf-border);
}
.nf-bar-left, .nf-bar-right, .nf-nav-actions { display: flex; align-items: center; gap: 4px; }
.nf-bar-left { min-width: 0; }
.nf-bar-right { flex: none; }
.nf-location {
  min-width: 0; margin-left: 10px; padding-left: 14px;
  border-left: 1px solid var(--nf-border); font-size: 12px;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
button.nf-button, button.nf-page-action {
  appearance: none; display: inline-flex; align-items: center; justify-content: center;
  flex: none; gap: 7px; min-width: 36px; min-height: 36px; height: auto; padding: 7px 11px;
  border: 1px solid transparent; border-radius: 7px; box-shadow: none;
  background: transparent; color: var(--nf-muted); font: 500 13px/1.4 var(--font-interface, system-ui);
  white-space: normal; cursor: pointer; touch-action: manipulation; -webkit-tap-highlight-color: transparent;
  transition: background-color 140ms, border-color 140ms, color 140ms, box-shadow 140ms;
}
button.nf-button:hover, button.nf-page-action:hover {
  background: var(--nf-hover); color: var(--nf-foreground); box-shadow: none;
}
.nf-icon, .nf-file-icon { display: inline-flex; flex: none; align-items: center; justify-content: center; }
.nf-icon svg, .nf-file-icon svg { width: 17px; height: 17px; stroke-width: 1.7; }
:is(.nf-button, .nf-page-action, .nf-file-row, .nf-resume):focus-visible,
.nf-page-heading h1:focus-visible {
  outline: 2px solid var(--nf-ring); outline-offset: 3px;
}
button.nf-page-action.nf-primary, .nf-dialog button.mod-cta {
  background: var(--nf-foreground); color: var(--nf-surface); border-color: var(--nf-foreground);
  box-shadow: 0 1px 2px #0000000a;
}
button.nf-page-action.nf-primary:hover, .nf-dialog button.mod-cta:hover { opacity: .87; }

/* The cover and content share a single, bounded reading column. */
.nf-page {
  flex: 1; min-height: 0; overflow-y: auto; overscroll-behavior: contain;
  padding-bottom: calc(56px + env(safe-area-inset-bottom, 0px));
  background: var(--nf-surface); color: var(--nf-foreground); scrollbar-gutter: stable;
}
.nf-cover {
  position: relative; width: calc(100% - 2 * var(--nf-gutter));
  max-width: calc(var(--nf-page-width) - 2 * var(--nf-gutter)); height: 164px;
  margin: 28px auto 0; overflow: hidden; border-radius: 12px;
  background: var(--nf-subtle); border: 1px solid var(--nf-border);
}
.nf-cover > img { display: block; width: 100%; height: 100%; object-fit: cover; }
.nf-cover > button.nf-page-action {
  position: absolute; bottom: 12px; right: 12px;
  background: var(--nf-surface); border-color: var(--nf-border); color: var(--nf-foreground);
  box-shadow: 0 1px 4px #00000012; opacity: 0;
}
.nf-cover:hover > button, .nf-cover:focus-within > button { opacity: 1; }
.nf-cover-missing { padding: 60px 20px; text-align: center; font-size: 13px; color: var(--nf-muted); }
.nf-page-heading, .nf-section-grid, .nf-page-tail {
  width: min(100%, var(--nf-page-width)); margin-inline: auto;
  padding-inline: var(--nf-gutter); box-sizing: border-box;
}
.nf-page-heading { display: flex; align-items: center; gap: 16px; padding-top: 32px; padding-bottom: 32px; }
.nf-heading-title { flex: 1; min-width: 0; }
.nf-page-heading h1 {
  font-size: clamp(25px, 3.4cqw, 32px); font-weight: 650; line-height: 1.3;
  margin: 0; letter-spacing: -.7px; cursor: text; overflow-wrap: anywhere; border-radius: 4px;
}
button.nf-page-icon {
  width: 48px; min-height: 48px; padding: 0; font-size: 26px; line-height: 1;
  border: 1px solid var(--nf-border); border-radius: 12px; background: var(--nf-subtle);
}
.nf-section-grid { display: grid; gap: 32px 28px; align-items: start; grid-template-columns: minmax(0, 1fr); }
.nf-section-grid[data-columns='2'] { grid-template-columns: minmax(0, var(--nf-ratio)) minmax(0, var(--nf-other)); }
.nf-section { position: relative; min-width: 0; border-radius: var(--nf-radius); outline: none; }
.nf-section:focus-visible { outline: 2px solid var(--nf-ring); outline-offset: 6px; }
.nf-section-tools { position: absolute; left: -32px; top: -7px; opacity: 0; z-index: 2; }
.nf-section:hover > .nf-section-tools, .nf-section:focus-within > .nf-section-tools { opacity: 1; }
button.nf-drag-handle { touch-action: none; cursor: grab; font-size: 21px; padding: 0; width: 28px; min-width: 28px; min-height: 36px; }
.nf-section-body { font-size: var(--font-text-size, 16px); line-height: 1.8; overflow-wrap: anywhere; cursor: text; }
.nf-section-body h2 { font-size: 17px; font-weight: 600; line-height: 1.5; letter-spacing: -.2px; margin: 0 0 16px; }
.nf-section-body :is(h3, h4) { font-size: 1em; font-weight: 600; margin: 20px 0 10px; }
.nf-section-body p { margin: 0 0 12px; }
.nf-section-body > :last-child { margin-bottom: 0; }
.nf-section-body img { max-width: 100%; height: auto; border-radius: var(--nf-radius); cursor: zoom-in; }
.nf-section-body :is(pre, .table-wrapper) { overflow-x: auto; }
.nf-section-body pre { border: 1px solid var(--nf-border); border-radius: var(--nf-radius); }
.nf-section-body table { display: block; overflow-x: auto; font-size: .9em; }
.nf-section-body blockquote { margin-inline: 0; padding: 4px 18px; border-left: 2px solid var(--nf-border); color: var(--nf-muted); }
.nf-intro, .nf-editing { grid-column: 1 / -1; }
.nf-dragging { opacity: .45; }
.nf-drop-target { box-shadow: 0 -3px 0 var(--interactive-accent); }

/* Gallery cards: bounded artwork, a readable title, then a quiet location row. */
.nf-cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(180px, 100%), 1fr)); gap: 16px; }
button.nf-card {
  display: flex; flex-direction: column; align-items: stretch; overflow: hidden; text-align: left;
  padding: 5px; gap: 0; min-width: 0; min-height: 96px; height: auto;
  color: var(--nf-foreground); background: var(--nf-surface); border: 1px solid var(--nf-border);
  border-radius: 12px; box-shadow: 0 1px 3px #00000005;
}
button.nf-card:hover { background: var(--nf-surface); border-color: var(--nf-ring); box-shadow: 0 3px 10px #0000000a; }
.nf-card img { display: block; flex: none; width: 100%; height: 128px; object-fit: cover; border-radius: 7px; cursor: pointer; }
.nf-card-content { display: flex; flex-direction: column; flex: 1; gap: 14px; padding: 14px 12px 10px; }
.nf-card-label { display: block; font-size: 14px; font-weight: 600; line-height: 1.6; overflow-wrap: anywhere; }
.nf-card-footer { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-top: auto; color: var(--nf-muted); font-size: 11px; font-weight: 400; }
.nf-card-location { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.nf-card-footer .nf-icon svg { width: 15px; height: 15px; }
.nf-page-tail { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 32px; }
.nf-page-tail > button { border-color: var(--nf-border); background: var(--nf-surface); }

/* Inline editing keeps the same spacing and primary/secondary action hierarchy. */
.nf-inline-editor, input.nf-title-input {
  width: 100%; box-sizing: border-box; color: var(--nf-foreground); background: var(--nf-surface);
  border: 1px solid var(--nf-border); border-radius: 8px; box-shadow: 0 1px 2px #00000005;
}
.nf-inline-editor { display: block; min-height: 160px; resize: vertical; font: 16px/1.8 var(--font-text, system-ui); padding: 14px 16px; }
input.nf-title-input { font-size: 26px; font-weight: 600; min-height: 48px; padding: 7px 12px; }
.nf-inline-editor:focus, input.nf-title-input:focus { border-color: var(--nf-ring); box-shadow: 0 0 0 3px color-mix(in srgb, var(--nf-ring) 25%, transparent); }
.nf-inline-actions { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; padding-top: 10px; }
.nf-inline-actions > span { color: var(--nf-muted); font-size: 12px; flex: 1; min-width: 100px; }
.nf-inline-format { display: flex; gap: 4px; padding: 6px 0; border-bottom: 1px solid var(--nf-border); }
.nf-inline-format > button { font-size: 12px; min-height: 30px; }

/* Dialogs and the command-style note picker. */
.modal.nf-dialog { border: 1px solid var(--nf-border); border-radius: 14px; background: var(--nf-surface); padding: 24px; }
.nf-dialog .modal-title { font-size: 18px; font-weight: 600; letter-spacing: -.3px; line-height: 1.5; margin-bottom: 20px; }
.nf-dialog .modal-content { font-size: 14px; }
.nf-dialog .modal-close-button { top: 16px; right: 16px; }
.nf-dialog :is(input[type=text], input:not([type]), input[type=search]) { min-height: 40px; border: 1px solid var(--nf-border); border-radius: 7px; background: var(--nf-surface); box-shadow: 0 1px 2px #00000005; font-size: 14px; }
.nf-dialog input:focus { border-color: var(--nf-ring); }
.nf-dialog p { color: var(--nf-muted); font-size: 12px; line-height: 1.7; }
.nf-dialog-actions { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; padding-top: 18px; border-top: 1px solid var(--nf-border); }
.nf-navigator { width: min(560px, 94vw); }
.nf-navigator .modal-content { display: flex; flex-direction: column; gap: 12px; overflow: hidden; }
.nf-nav-actions { justify-content: flex-end; margin-top: 0; }
.nf-nav-actions .nf-button:first-child { margin-right: auto; }
.nf-nav-actions .nf-button { border-color: var(--nf-border); color: var(--nf-foreground); }
.nf-search-field { position: relative; flex-shrink: 0; }
.nf-search-field > .nf-icon { position: absolute; left: 13px; top: 50%; transform: translateY(-50%); color: var(--nf-muted); pointer-events: none; }
.nf-dialog input.nf-search { width: 100%; min-height: 44px; padding-left: 38px; background: var(--nf-subtle); }
.nf-breadcrumb { display: flex; align-items: center; gap: 6px; min-height: 28px; color: var(--nf-muted); font-size: 12px; overflow-wrap: anywhere; }
.nf-breadcrumb .nf-button { font-size: 12px; padding-inline: 4px; }
.nf-file-list { min-height: 100px; overflow-y: auto; overscroll-behavior: contain; padding: 3px; max-height: 58vh; margin-inline: -3px; border-top: 1px solid var(--nf-border); }
button.nf-file-row {
  appearance: none; display: flex; align-items: center; justify-content: flex-start; gap: 12px; width: 100%; height: auto;
  min-height: 48px; padding: 10px; background: transparent; border: 0; border-radius: 7px;
  box-shadow: none; color: var(--nf-foreground); text-align: left; font-size: 14px; cursor: pointer; touch-action: manipulation;
}
button.nf-file-row:hover { background: var(--nf-hover); box-shadow: none; }
.nf-file-icon { color: var(--nf-muted); }
.nf-file-copy { flex: 1; display: flex; flex-direction: column; min-width: 0; gap: 4px; }
.nf-file-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; width: 100%; line-height: 1.4; }
.nf-file-path { color: var(--nf-muted); font-size: 11px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.nf-empty { padding: 30px 10px; text-align: center; color: var(--nf-muted); line-height: 1.7; }
.nf-help { color: var(--nf-muted, var(--text-muted)); font-size: 13px; line-height: 1.7; }
.nf-name-form { display: flex; flex-direction: column; gap: 12px; }
.nf-name-form input { width: 100%; min-height: 44px; }
.nf-error { color: var(--text-error); font-size: 13px; }
.nf-cover-presets { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; margin-bottom: 24px; }
.nf-cover-presets button.nf-page-action { display: flex; flex-direction: column; align-items: stretch; justify-content: flex-start; gap: 10px; height: auto; padding: 10px 5px 5px; overflow: hidden; border-color: var(--nf-border); border-radius: 9px; font-size: 12px; color: var(--nf-foreground); }
.nf-cover-presets img { display: block; flex: none; width: 100%; height: 80px; object-fit: cover; border-radius: 5px; }
.nf-cover-dialog label { display: block; margin-block: 20px; font-size: 13px; font-weight: 500; }
.nf-cover-dialog input { display: block; width: 100%; box-sizing: border-box; margin-top: 10px; }
.nf-dialog input[type=file] { color: var(--nf-muted); font-size: 12px; padding: 12px; border: 1px dashed var(--nf-border); border-radius: 8px; background: var(--nf-subtle); }
.nf-dialog input[type=file]::file-selector-button { padding: 6px 10px; margin-right: 12px; border: 1px solid var(--nf-border); border-radius: 6px; background: var(--nf-surface); color: var(--nf-foreground); font: inherit; cursor: pointer; }
.nf-icon-dialog .modal-content { display: flex; align-items: center; gap: 12px; }
.nf-icon-dialog input { flex: 1; min-width: 0; }
.nf-image-modal img { max-width: 100%; max-height: 80vh; object-fit: contain; }
button.nf-resume { position: fixed; z-index: 1000; right: 12px; bottom: calc(92px + env(safe-area-inset-bottom, 0px)); border: 1px solid var(--nf-border); background: var(--nf-surface); color: var(--nf-foreground); border-radius: 9px; box-shadow: var(--shadow-s); }
.nf-sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; border: 0; }

/* Keep native reading views comfortable when the portable page is unavailable. */
.nf-managed.nf-typography .markdown-preview-view { --line-height-normal: 1.75; --p-spacing: 1.15rem; }
.nf-managed.nf-typography .markdown-preview-sizer { padding-bottom: 50px; }
.nf-managed.nf-typography .markdown-preview-view img { max-width: 100%; height: auto; border-radius: 8px; }
.nf-managed.nf-typography .markdown-preview-view :is(pre, .table-wrapper) { overflow-x: auto; }
body.is-mobile .nf-managed.nf-typography .markdown-preview-view { padding-inline: 22px; }
body.is-mobile .nf-managed.nf-reading-view { padding-bottom: env(safe-area-inset-bottom, 12px); }

/* Narrow split panes need the same adaptation as narrow app windows. */
@container nebula-page (max-width: 650px) {
  .nf-page { --nf-gutter: 24px; }
  .nf-cover { height: 124px; margin-top: 20px; }
  .nf-page-heading { gap: 12px; padding-top: 24px; padding-bottom: 28px; }
  .nf-page-heading h1 { font-size: 25px; }
  button.nf-page-icon { width: 42px; min-height: 42px; font-size: 23px; }
  .nf-section-grid { row-gap: 28px; }
  .nf-section-grid[data-columns='2'] { grid-template-columns: minmax(0, 1fr); }
  .nf-section-tools { left: -24px; }
  button.nf-drag-handle { min-width: 22px; width: 22px; }
  .nf-bar { padding-inline: 10px; gap: 8px; }
  .nf-location { margin-left: 4px; padding-left: 8px; }
}
@container nebula-page (max-width: 400px) {
  .nf-location { display: none; }
  .nf-bar { padding-inline: 6px; }
  .nf-bar .nf-button { padding-inline: 8px; }
}
@media (max-width: 650px) {
  .nf-page { --nf-gutter: 24px; }
  .nf-cover { height: 124px; margin-top: 20px; }
  .nf-page-heading { gap: 12px; padding-top: 24px; padding-bottom: 28px; }
  .nf-page-heading h1 { font-size: 25px; }
  button.nf-page-icon { width: 42px; min-height: 42px; font-size: 23px; }
  .nf-section-grid { row-gap: 28px; }
  .nf-section-grid[data-columns='2'] { grid-template-columns: minmax(0, 1fr); }
  .nf-section-tools { left: -24px; }
  button.nf-drag-handle { min-width: 22px; width: 22px; }
  .nf-bar { padding-inline: 10px; gap: 8px; }
  .nf-location { margin-left: 4px; padding-left: 8px; }
  .modal.nf-dialog { padding: 20px; max-width: calc(100vw - 24px); max-height: 90vh; }
  .nf-navigator .modal-content { padding-bottom: env(safe-area-inset-bottom, 0px); }
  .nf-file-list { max-height: 60vh; }
  .nf-preferences .setting-item { flex-wrap: wrap; gap: 12px; }
  .nf-dialog :is(input[type=text], input:not([type]), input[type=search]) { font-size: 16px; }
}
@media (max-width: 400px) { .nf-location { display: none; } }
@media (hover: none), (pointer: coarse) {
  button.nf-button, button.nf-page-action { min-height: 44px; }
  button.nf-button { min-width: 44px; }
  .nf-cover > button.nf-page-action { opacity: 1; }
  .nf-section-tools { opacity: 1; }
}
@media (prefers-reduced-motion: reduce) {
  button.nf-button, button.nf-page-action { transition: none; }
}

body.is-mobile button.nf-button, body.is-mobile button.nf-page-action { min-height: 44px; }
body.is-mobile button.nf-button { min-width: 44px; }
